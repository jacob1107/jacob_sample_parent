apiVersion: v1
kind: ServiceAccount
metadata:
  name: leader-worker-sa
  namespace: lws-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-worker-role
  namespace: lws-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-worker-rolebinding
  namespace: lws-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-worker-role
subjects:
  - kind: ServiceAccount
    name: leader-worker-sa
    namespace: lws-demo